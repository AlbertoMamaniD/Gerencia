name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bolivia (UTC-4): las pruebas de fechas se ejecutan en la zona horaria real de uso.
      TZ: America/La_Paz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: Pruebas con cobertura
        run: npm run test:ci

      - name: Salud del proyecto (expo-doctor)
        run: npx expo-doctor

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  bundle:
    name: Compilación del bundle (Android y web)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Verifica que Metro empaquete la app completa sin errores (no requiere secretos).
      - name: Exportar bundle de Android
        run: npx expo export --platform android --output-dir dist-android

      - name: Exportar bundle web
        run: npx expo export --platform web --output-dir dist-web
