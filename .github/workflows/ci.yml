name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bolivia (UTC-4): las pruebas de fechas se ejecutan en la zona horaria real de uso.
      TZ: America/La_Paz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings 0

      - name: Pruebas con cobertura
        run: npm run test:ci

      - name: Salud del proyecto (expo-doctor)
        run: npx expo-doctor

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  security:
    name: Seguridad (Supabase RLS y Edge Function)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Esquema + migración (2 veces) + pruebas: cada usuario solo ve lo suyo,
      # anon no lee nada, bucket privado, cuota de OCR y validación de datos.
      - name: Pruebas de políticas RLS
        run: bash scripts/test-supabase-sql.sh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verificar tipos de la Edge Function ocr-meter
        working-directory: supabase/functions/ocr-meter
        run: deno check --config deno.json index.ts

      - name: Buscar claves expuestas en el código
        run: |
          if grep -rEn "AIza[0-9A-Za-z_-]{30,}|sb_secret_[0-9A-Za-z]{20,}|service_role.[A-Za-z0-9]" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Se encontró una posible clave secreta en el repositorio."
            exit 1
          fi
          if grep -rn "EXPO_PUBLIC_GEMINI" src/; then
            echo "::error::La clave de Gemini no debe usarse en la app (va solo en la Edge Function)."
            exit 1
          fi

  bundle:
    name: Compilación del bundle (Android y web)
    runs-on: ubuntu-latest
    needs: [quality, security]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Verifica que Metro empaquete la app completa sin errores (no requiere secretos).
      - name: Exportar bundle de Android
        run: npx expo export --platform android --output-dir dist-android

      - name: Exportar bundle web
        run: npx expo export --platform web --output-dir dist-web
